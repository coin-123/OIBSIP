<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="index.js" defer></script>
</head>
<body>
    <div class="container">

        <div class="theme">
            <button class=" theme-btn">🌓</button>
        </div>

        <!-- container for screen display -->
        <div class="screens">

            <!-- Top screen display -->
            <div class="topScreen">
                <P>0</P>
            </div>

            <!-- Bottom screen display -->
             <div class="bottomScreen">
                <P></P>
             </div>

        </div>
        

        <!-- container for buttons -->
        <div class="btnContainer">
            <section class="buttons-for-all">

                <button class="btn btn-operator" >*</button>
                <button class="btn btn-operator">/</button>
                <button class="btn btn-operator">+</button>
                <button class="btn btn-operator">-</button>
                <button class="btn btn-key" >7</button>
                <button class="btn btn-key">8</button>
            
                <button class="btn btn-key" >9</button>
                <!-- <button class="btn btn-oprito right">&LeftTeeArrow;</button> -->
                <button class="btn btn-oprito right">DEL</button>
                <button class="btn btn-key" >4</button>
                <button class="btn btn-key" >5</button>
                <button class="btn btn-key" >6</button>
                <button class="btn btn-oprite right">C</button>
                <button class="btn btn-key" >1</button>
                <button class="btn btn-key" >2</button>
                <button class="btn btn-key" >3</button>
                <button class="btn btn-key zero" >0</button>
                <button class="btn btn-key dot" >.</button>
                <button class="btn equal">=</button>

            </section>

        </div>

    </div>
</body>
</html>
